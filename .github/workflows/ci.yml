name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/native.yml

  android-build:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: native-out
          path: native/out
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit tests, lint and layer dependency check
        run: ./gradlew build lint --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-and-test-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/test-results/**/*.xml
          retention-days: 7

  device-tests:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        module:
          - app
          - presentation
          - 'infrastructure:core'
          - 'infrastructure:engine-ffmpeg'
          - 'infrastructure:engine-imagemagick'
          - 'infrastructure:engine-libheif'
          - 'infrastructure:engine-libarchive'
          - 'infrastructure:engine-mupdf'
          - 'infrastructure:engine-pandoc'
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY"
      - uses: actions/download-artifact@v7
        with:
          name: native-out
          path: native/out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Restore emulator and system images
        id: sdk-images
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/system-images
          key: emulator-images-${{ runner.os }}-${{ hashFiles('build-logic/src/main/kotlin/omni.android-test.gradle.kts') }}
      - name: Install emulator and system images with retries
        if: steps.sdk-images.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4; do
            sdkmanager --install "emulator" "system-images;android-31;google_apis;x86_64" "system-images;android-37.0;google_apis;x86_64" && exit 0
            echo "sdkmanager failed (attempt $attempt); retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Save emulator and system images
        if: steps.sdk-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/system-images
          key: ${{ steps.sdk-images.outputs.cache-primary-key }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Instrumented tests and E2E on API 31 and 37 emulators
        run: ./gradlew :${{ matrix.module }}:ciGroupDebugAndroidTest --continue -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-test-reports-${{ strategy.job-index }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 7

  emulator-tests:
    needs: device-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require device tests of every module to pass
        run: test "${{ needs.device-tests.result }}" = success
