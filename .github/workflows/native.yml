# ネイティブエンジンをソースからビルドし、native-out として渡す。CI とリリースの両方から呼ぶ。ADR-0005
name: Native engines

on:
  workflow_call:

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # レシピと版が変わらない限り、前回の成果物を使う
      - name: Restore native engines
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: native/out
          key: native-${{ hashFiles('native/Dockerfile', 'native/build.sh', 'native/versions.sh', 'native/lib/**', 'native/recipes/**') }}
      - name: Build native engines
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: native/run.sh ffmpeg libheif libarchive imagemagick mupdf pandoc
      - name: Save native engines
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/out
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-out
          path: native/out
          retention-days: 3
