# v で始まるタグを push すると、署名済み APK を GitHub Releases に公開する。ADR-0012
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  native:
    uses: ./.github/workflows/native.yml

  release:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: native-out
          path: native/out
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::署名鍵のシークレット ANDROID_KEYSTORE_BASE64 がありません"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Run all checks and build the signed release APK
        env:
          OMNI_KEYSTORE: ${{ runner.temp }}/release.jks
          OMNI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OMNI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OMNI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew check :app:assembleRelease --console=plain
          -PversionName=${GITHUB_REF_NAME#v} -PversionCode=${{ github.run_number }}

      - name: Verify signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "OmniConverter-${GITHUB_REF_NAME}.apk"
          (cd native/out/assets && zip -qr "$GITHUB_WORKSPACE/licenses.zip" licenses)
          cat > notes.md <<EOF
          OmniConverter ${GITHUB_REF_NAME} です。arm64-v8a の Android 10 以降で動きます。

          このアプリは AGPL-3.0 で配布しています。対応するソースはこのタグの時点のリポジトリです。
          同梱したエンジンのライセンスは licenses.zip にあります。エンジンの版は native/versions.sh を参照してください。
          EOF
          gh release create "$GITHUB_REF_NAME" "OmniConverter-${GITHUB_REF_NAME}.apk" licenses.zip \
            --title "OmniConverter ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
